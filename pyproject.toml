[project]
name = "mcp-hangar-benchmarks"
version = "0.1.0"
description = "Publication-quality benchmark suite for mcp-hangar parallel MCP tool execution"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp-hangar>=0.6.0",
    "mcp>=1.0.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
bench = "src.runner:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
